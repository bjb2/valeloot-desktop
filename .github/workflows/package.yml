name: Package desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            artifact: windows-x64
            files: dist/*.exe
          - os: ubuntu-latest
            script: package:linux
            artifact: linux-x64
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes binutils rpm xz-utils
      - run: bun run ${{ matrix.script }}
      - name: Verify Linux package capabilities
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install --yes ./dist/*.deb
          runtime='/opt/ValeLoot Desktop/resources/collector/bin/bun'
          getcap "$runtime" | grep -F 'cap_net_admin,cap_net_raw=eip'
          rpm -qp --requires ./dist/*.rpm | grep -Fx 'libcap'
          rpm -qp --requires ./dist/*.rpm | grep -Fx 'libpcap'
          rpm -qp --scripts ./dist/*.rpm | grep -F "setcap 'cap_net_raw,cap_net_admin=eip'"
      - uses: actions/upload-artifact@v4
        with:
          name: valeloot-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: valeloot-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
